[package]
name = "corkboard-studio"
version = "1.0.0"
description = "Tablero de investigación tipo corcho con modo reproducción cinematográfico"
authors = ["Kurokenshi"]
license = "MIT"
repository = "https://github.com/Kurokenshi/corkboard-studio"
edition = "2021"

[lib]
name = "corkboard_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
