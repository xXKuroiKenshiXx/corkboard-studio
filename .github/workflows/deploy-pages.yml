# Publica la versión web en GitHub Pages.
#
# IMPORTANTE: en un dominio HTTPS tldraw necesita una clave de licencia
# (sin ella deja de dibujar a los 5 s). Pedí una licencia hobby gratuita en
# https://tldraw.dev/get-a-license/hobby y guardala en el repo como secret:
#   Settings → Secrets and variables → Actions → New repository secret
#   Nombre: TLDRAW_LICENSE_KEY
# Después: Settings → Pages → Source: “GitHub Actions”, y ejecutá este workflow.
name: Deploy web (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ¿Hay licencia de tldraw?
        id: lic
        env:
          KEY: ${{ secrets.TLDRAW_LICENSE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::Falta el secret TLDRAW_LICENSE_KEY: no se publica la web (tldraw no funciona en HTTPS sin licencia)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.lic.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.lic.outputs.ok == 'true'
      - run: npm run build:web
        if: steps.lic.outputs.ok == 'true'
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_TLDRAW_LICENSE_KEY: ${{ secrets.TLDRAW_LICENSE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        if: steps.lic.outputs.ok == 'true'
        with:
          path: dist
    outputs:
      ok: ${{ steps.lic.outputs.ok }}

  deploy:
    needs: build
    if: needs.build.outputs.ok == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
