<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="cork" cx="45%" cy="40%" r="75%">
      <stop offset="0" stop-color="#cf9a62"/>
      <stop offset="0.65" stop-color="#b47a45"/>
      <stop offset="1" stop-color="#7d4f29"/>
    </radialGradient>
    <pattern id="grain" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="7" r="2.2" fill="#6e4222" opacity=".45"/>
      <circle cx="22" cy="4" r="1.6" fill="#f1c999" opacity=".45"/>
      <circle cx="15" cy="19" r="2.6" fill="#6e4222" opacity=".35"/>
      <circle cx="31" cy="22" r="1.8" fill="#f1c999" opacity=".4"/>
      <circle cx="9" cy="30" r="1.5" fill="#6e4222" opacity=".5"/>
      <circle cx="27" cy="33" r="2" fill="#6e4222" opacity=".3"/>
    </pattern>
    <radialGradient id="beam" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff1c9" stop-opacity=".55"/>
      <stop offset=".7" stop-color="#fff1c9" stop-opacity=".12"/>
      <stop offset="1" stop-color="#fff1c9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinhead" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ff8a8f"/>
      <stop offset=".45" stop-color="#e0262f"/>
      <stop offset="1" stop-color="#8c0f16"/>
    </radialGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a55"/>
      <stop offset="1" stop-color="#121826"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="12" stdDeviation="10" flood-color="#2a160a" flood-opacity=".55"/>
    </filter>
    <clipPath id="r"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="512" height="512" fill="url(#cork)"/>
    <rect width="512" height="512" fill="url(#grain)"/>
    <!-- hilo rojo -->
    <path d="M70 92 C 160 150, 200 120, 262 128" stroke="#c81e1e" stroke-width="7" fill="none" stroke-linecap="round"/>
    <circle cx="70" cy="92" r="15" fill="url(#pinhead)"/>
    <!-- haz de linterna -->
    <ellipse cx="262" cy="262" rx="230" ry="215" fill="url(#beam)"/>
    <!-- polaroid -->
    <g transform="rotate(-7 262 270)" filter="url(#sh)">
      <rect x="128" y="120" width="268" height="304" rx="6" fill="#fbf8f1"/>
      <rect x="148" y="140" width="228" height="200" fill="url(#photo)"/>
      <!-- lupa dentro de la foto -->
      <circle cx="252" cy="230" r="46" fill="none" stroke="#f5c518" stroke-width="13"/>
      <path d="M286 264 L330 308" stroke="#f5c518" stroke-width="17" stroke-linecap="round"/>
      <path d="M170 378 h120" stroke="#2a2a2a" stroke-width="9" stroke-linecap="round" opacity=".75"/>
      <path d="M170 400 h80" stroke="#2a2a2a" stroke-width="9" stroke-linecap="round" opacity=".45"/>
    </g>
    <!-- pin de la foto -->
    <ellipse cx="272" cy="136" rx="22" ry="17" fill="#2a160a" opacity=".35"/>
    <circle cx="262" cy="126" r="24" fill="url(#pinhead)"/>
    <circle cx="254" cy="117" r="7" fill="#fff" opacity=".7"/>
    <!-- badge play -->
    <g filter="url(#sh)">
      <circle cx="404" cy="404" r="62" fill="#1c1814"/>
      <path d="M386 374 L434 404 L386 434 Z" fill="#f5c518"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
